spring.application.name=insurance-tracker
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/mockdb
spring.datasource.username=mockuser
spring.datasource.password=mockpass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=mockuser
spring.security.user.password=mockpass

frontend.url=http://localhost:3000

spring.security.oauth2.client.registration.google.client-id=mock-google-id
spring.security.oauth2.client.registration.google.client-secret=mock-google-secret

spring.ai.openai.api-key=mock-openai-key

spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=mock-mail-user
spring.mail.password=mock-mail-pass
